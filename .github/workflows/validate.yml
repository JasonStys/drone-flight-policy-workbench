# Jason Stys: real OPA/Python/SQL/TypeScript cross-platform validation without artifact/cache uploads.
name: Validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core / ${{ matrix.os }} / ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: ubuntu-24.04, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
          - {os: macos-latest, python: '3.14'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '${{ matrix.python }}'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', package-manager-cache: false}
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python tools/fetch_opa.py
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run format:check && npm test && npm run build
      - run: python -m ruff check workbench tests tools
      - run: python -m ruff format --check workbench tests tools
      - run: python -m tools.opa_checks
      - run: python tools/docs_index.py --check
      - run: python -m pytest --cov=workbench --cov-report=term-missing
      - run: python tools/check_repo.py
      - run: python -m tools.benchmark
      - if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.14'
        run: python -m pip_audit --disable-pip --no-deps -r requirements-dev.lock
      - if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.14'
        name: Live OSV / complete locked npm inventory / zero findings
        run: python tools/audit_osv.py
  browser:
    name: Real native-backed UI / Chromium + Firefox + WebKit + mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', package-manager-cache: false}
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python tools/fetch_opa.py
      - run: npm ci --ignore-scripts --no-audit && npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
